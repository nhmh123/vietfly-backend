services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: vietfly_php

    working_dir: /var/www

    volumes:
      - .:/var/www

  nginx:
    image: nginx:latest

    container_name: vietfly_nginx

    ports:
      - "8000:80"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

  mysql:
    image: mysql:8.4

    container_name: vietfly_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vietfly

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:8

    container_name: vietfly_redis

    ports:
      - "6379:6379"

volumes:
  mysql_data: